# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: Publish Docker Image
description: Publish Docker image to container registry

inputs:
  image-name:
    description: "Docker image name (without registry/owner)"
    required: true
  full-sem-ver:
    description: "The full semantic version"
    required: true
  registry:
    description: "Container registry URL"
    default: "ghcr.io"
  github-token:
    description: "GitHub token for authentication"
    required: true
  tag-latest:
    description: "Whether to tag and push as latest"
    default: "true"
  artifact-name:
    description: "Name of the artifact to download"
    default: "docker-image"

runs:
  using: "composite"
  steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/${{ inputs.image-name }}.tar
      shell: bash

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Tag and push Docker image
      run: |
        OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        REGISTRY_IMAGE="${{ inputs.registry }}/${OWNER_LC}/${{ inputs.image-name }}"

        # Sanitize version for Docker tag (replace + with -)
        DOCKER_TAG=$(echo "${{ inputs.full-sem-ver }}" | sed 's/+/-/g')

        # Tag with version
        docker tag ${{ inputs.image-name }}:${DOCKER_TAG} ${REGISTRY_IMAGE}:${DOCKER_TAG}
        docker push ${REGISTRY_IMAGE}:${DOCKER_TAG}
        echo "✅ Published Docker image: ${REGISTRY_IMAGE}:${DOCKER_TAG}"

        # Tag with latest (if enabled)
        if [ "${{ inputs.tag-latest }}" = "true" ]; then
          docker tag ${{ inputs.image-name }}:latest ${REGISTRY_IMAGE}:latest
          docker push ${REGISTRY_IMAGE}:latest
          echo "✅ Published Docker image: ${REGISTRY_IMAGE}:latest"
        fi
      shell: bash
