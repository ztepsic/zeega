# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Main
permissions:
  contents: read
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
  pull_request:
    branches:
      - "*"

env:
  DOTNET_VERSION: 10.x
  IMAGE_NAME: zeega-web

jobs:
  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    outputs:
      FullSemVer: ${{ steps.versioning.outputs.FullSemVer }} # Job output
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Determine version
        uses: ./.github/actions/versioning
        id: versioning
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - name: Print version
        run: "echo 'FullSemVer: ${{steps.versioning.outputs.FullSemVer}}'"
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}
          # cache: true

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore --locked-mode

      - name: Build
        working-directory: src
        run: |
          dotnet build \
            --configuration Release \
            --no-restore

      - name: Publish
        working-directory: src
        run: |
          dotnet publish \
            --configuration Release \
            --no-restore \
            --no-build \
            -o ../publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      # - name: Download build artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: build

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}
          #cache: true

      - name: Run tests
        working-directory: src
        run: |
          dotnet test \
            --configuration Release \
            --logger "trx" \
            --results-directory "TestResults" \
            --logger:"junit;LogFilePath=../TestResults/{assembly}_junit.test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose" \
            -p:CollectCoverage=true \
            -p:CoverletOutput="../TestResults/" \
            -p:CoverletOutputFormat=\"json,cobertura,opencover\"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/TestResults
        if: ${{always()}}

  pack-docker:
    name: Pack (Docker Image)
    runs-on: ubuntu-latest
    needs: [versioning, build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: src/publish

      - name: Build Docker Image
        uses: ./.github/actions/pack-docker
        with:
          dockerfile-path: src/Dockerfile
          build-context: src
          image-name: ${{env.IMAGE_NAME}}
          full-sem-ver: ${{needs.versioning.outputs.FullSemVer}}
          tag-latest: ${{ github.ref == 'refs/heads/master' }}

  publish-docker:
    name: Publish (Docker Image)
    runs-on: ubuntu-latest
    needs: [versioning, pack-docker]
    permissions:
      packages: write
    environment:
      # name: ${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}
      name: ${{ 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Publish Docker Image
        uses: ./.github/actions/publish-docker
        with:
          image-name: ${{env.IMAGE_NAME}}
          full-sem-ver: ${{needs.versioning.outputs.FullSemVer}}
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag-latest: ${{ github.ref == 'refs/heads/master' }}

  release-docker:
    name: Release (Docker Image)
    runs-on: ubuntu-latest
    needs: [versioning, pack-docker]
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning

      - name: Release Docker Image
        uses: ./.github/actions/release-docker
        with:
          image-name: ${{env.IMAGE_NAME}}
          full-sem-ver: ${{needs.versioning.outputs.FullSemVer}}
          registry: ghcr.io
          github-token: ${{secrets.GITHUB_TOKEN}}
